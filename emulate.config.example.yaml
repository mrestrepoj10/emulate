tokens:
  gho_test_token_admin:
    login: admin
    scopes: [repo, user, admin:org, admin:repo_hook]
  gho_test_token_octocat:
    login: octocat
    scopes: [repo, user, read:user, "user:email", workflow]

github:
  users:
    - login: octocat
      name: The Octocat
      email: octocat@github.com
      bio: I am the Octocat
      company: GitHub
      location: San Francisco
    - login: developer
      name: Developer
      email: dev@example.com
  orgs:
    - login: my-org
      name: My Organization
      description: A test organization
  repos:
    - owner: octocat
      name: hello-world
      description: My first repository
      language: JavaScript
      topics: [hello, world]
      auto_init: true
    - owner: my-org
      name: org-repo
      description: An organization repository
      language: TypeScript
      auto_init: true
  apps:
    - app_id: 12345
      slug: my-github-app
      name: My GitHub App
      private_key: |
        -----BEGIN RSA PRIVATE KEY-----
        ...your PEM key...
        -----END RSA PRIVATE KEY-----
      permissions:
        contents: read
        issues: write
      events: [push, pull_request, issues]
      webhook_url: http://localhost:3000/webhooks/github
      webhook_secret: my-webhook-secret
      installations:
        - installation_id: 100
          account: octocat
          repository_selection: all
  oauth_apps:
    - client_id: emu_github_client_id
      client_secret: emu_github_client_secret
      name: Code App
      redirect_uris:
        - http://localhost:3000/api/auth/callback/github

vercel:
  users:
    - username: developer
      name: Developer
      email: dev@example.com
  teams:
    - slug: my-team
      name: My Team
  projects:
    - name: my-app
      team: my-team
      framework: nextjs
  integrations:
    - client_id: emu_vercel_client_id
      client_secret: emu_vercel_client_secret
      name: Code App (Vercel)
      redirect_uris:
        - http://localhost:3000/api/auth/callback/vercel

google:
  users:
    - email: testuser@gmail.com
      name: Test User
    - email: dev@example.com
      name: Developer
  oauth_clients:
    - client_id: emu_google_client_id
      client_secret: emu_google_client_secret
      name: Code App (Google)
      redirect_uris:
        - http://localhost:3000/api/auth/callback/google
  labels:
    - id: Label_ops
      user_email: testuser@gmail.com
      name: Ops/Review
      color_background: "#DDEEFF"
      color_text: "#111111"
  messages:
    - id: msg_welcome
      user_email: testuser@gmail.com
      from: welcome@example.com
      to: testuser@gmail.com
      subject: Welcome to the Gmail emulator
      body_text: You can now test Gmail, Calendar, and Drive flows locally.
      label_ids:
        - INBOX
        - UNREAD
        - CATEGORY_UPDATES
      date: 2025-01-04T10:00:00.000Z
  calendars:
    - id: primary
      user_email: testuser@gmail.com
      summary: testuser@gmail.com
      primary: true
      selected: true
      time_zone: UTC
  calendar_events:
    - id: evt_kickoff
      user_email: testuser@gmail.com
      calendar_id: primary
      summary: Project Kickoff
      start_date_time: 2025-01-10T09:00:00.000Z
      end_date_time: 2025-01-10T09:30:00.000Z
  drive_items:
    - id: drv_docs
      user_email: testuser@gmail.com
      name: Docs
      mime_type: application/vnd.google-apps.folder
      parent_ids:
        - root

aps:
  users:
    - email: testuser@autodesk.local
      name: Test User
  clients:
    - client_id: emu_aps_client_id
      client_secret: emu_aps_client_secret
      name: Code App (APS)
      redirect_uris:
        - http://localhost:3000/api/auth/callback/aps
        - http://localhost:3000/api/auth/oauth2/callback/aps
    - client_id: emu_aps_desktop_client
      type: public
      redirect_uris:
        - http://localhost:3000/callback
  hubs:
    - id: b.emulate-hub
      name: Emulate Construction Hub
      region: US
  projects:
    # Each project hub_id must match a seeded hub.
    - id: b.emulate-project
      hub_id: b.emulate-hub
      name: Sample Building
    - id: b.emulate-infrastructure
      hub_id: b.emulate-hub
      name: Sample Infrastructure
  acc_project_users:
    - project_id: b.emulate-project
      user_email: testuser@autodesk.local
      role: project_admin
      issue_permission: manage
      rfi_roles:
        - project_admin
        - projectGC
        - projectSC
  issue_types:
    - id: 11111111-1111-4111-8111-111111111111
      project_id: b.emulate-project
      title: Coordination
      subtypes:
        - id: 22222222-2222-4222-8222-222222222222
          title: Clash
          code: CLASH
  issues:
    - id: 33333333-3333-4333-8333-333333333333
      project_id: b.emulate-project
      title: Door clearance conflict
      description: The door conflicts with the adjacent wall finish.
      issue_type_id: 11111111-1111-4111-8111-111111111111
      issue_subtype_id: 22222222-2222-4222-8222-222222222222
      status: open
      assigned_to: testuser@autodesk.local
      due_date: 2026-08-26
  rfi_types:
    - id: 55555555-5555-4555-8555-555555555555
      project_id: b.emulate-project
      name: Design clarification
      is_default: true
      workflow_type: US
  rfi_attributes:
    - id: 66666666-6666-4666-8666-666666666666
      project_id: b.emulate-project
      name: Specification section
      type: text
  rfis:
    - id: 77777777-7777-4777-8777-777777777777
      project_id: b.emulate-project
      rfi_type_id: 55555555-5555-4555-8555-555555555555
      custom_identifier: RFI-001
      title: Confirm structural opening
      question: What dimensions should be used for the structural opening?
      status: open
      priority: High
  sheet_collections:
    - id: 99999999-9999-4999-8999-999999999999
      project_id: b.emulate-project
      name: Issued for Construction
  sheet_version_sets:
    - id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      project_id: b.emulate-project
      name: August 2026 Issue
      issuance_date: 2026-08-19
      collection_id: 99999999-9999-4999-8999-999999999999
  sheets:
    - id: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
      project_id: b.emulate-project
      number: A-101
      title: Level 1 Floor Plan
      version_set_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      collection_id: 99999999-9999-4999-8999-999999999999
      tags:
        - architectural
        - floor-plan
  manifests:
    dXJuOmFkc2sub2JqZWN0czpvcy5vYmplY3Q6ZW11bGF0ZS1idWNrZXQvc2FtcGxlLnJ2dA:
      status: success
      progress: complete
      region: US
      derivatives:
        - outputType: svf2
          status: success
          progress: complete
  # Delivery timing knobs (the values shown are the defaults).
  webhook_timing:
    max_retries: 8
    retry_base_ms: 25
    retry_max_ms: 1000
    failed_events_before_inactive: 5
    reactivate_after_ms: 1000
    max_reactivation_cycles: 5
    delivery_timeout_ms: 6000
  document_folders:
    - id: urn:adsk.wipprod:fs.folder:co.emulate-documents
      project_id: b.emulate-project
      name: Project Files
    - id: urn:adsk.wipprod:fs.folder:co.emulate-plans
      project_id: b.emulate-project
      parent_folder_id: urn:adsk.wipprod:fs.folder:co.emulate-documents
      name: Plans
  document_items:
    - id: urn:adsk.wipprod:dm.lineage:emulate-sample-model
      project_id: b.emulate-project
      folder_id: urn:adsk.wipprod:fs.folder:co.emulate-plans
      display_name: sample.rvt
  document_versions:
    - version_id: urn:adsk.wipprod:fs.file:vf.emulate-sample-model?version=1
      item_id: urn:adsk.wipprod:dm.lineage:emulate-sample-model
      project_id: b.emulate-project
      version_number: 1
      display_name: sample.rvt
  webhooks:
    - system: data
      event: dm.version.added
      callback_url: http://localhost:3000/api/webhooks/aps
      scope:
        folder: urn:adsk.wipprod:fs.folder:co.emulate-documents
      creator_client_id: aps-test-client
      auto_reactivate_hook: true
